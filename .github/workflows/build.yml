name: Build image & send to Scaleway
on:
  push:
    branches:
      - release
env:
  REGISTRY: rg.fr-par.scw.cloud
  IMAGE: rg.fr-par.scw.cloud/funcscwrayon22namespaceipzcor69/esl22-app
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Scaleway registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SCW_REGISTRY_USERNAME }}
          password: ${{ secrets.SCW_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ github.run_number }}
            ${{ env.IMAGE }}:latest

      - name: Print pushed tags
        run: |
          echo "Pushed: ${{ env.IMAGE }}:v${{ github.run_number }} and ${{ env.IMAGE }}:latest"

